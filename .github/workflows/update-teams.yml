name: Update TPV Team List

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape team list
        run: python .github/scripts/scrape_teams.py
      - name: Commit team list if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f teams_list.json
          if git diff --cached --quiet; then
            echo "Team list is unchanged."
          else
            git commit -m "Update TPV team list"
            git push
          fi
