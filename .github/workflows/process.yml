name: Process TPV Results

on:
  push:
    paths:
      - 'parser/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      file_path:
        description: 'CSV file path to process'
        required: true
        default: 'SampleData/Sample Data - Raw.csv'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape team list
        run: |
          python .github/scripts/scrape_teams.py || echo "Scrape skipped (optional)"
      - name: Run parser
        run: python parser/process.py "${{ github.event.inputs.file_path || 'SampleData/Sample Data - Raw.csv' }}" output.csv
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: upload-ready-csv
          path: output.csv
