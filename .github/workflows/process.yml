name: Process TPV Results

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Path to a CSV already committed in this repository'
        required: true
        type: string
      race_name:
        description: 'Race name'
        required: true
        type: string
      rename_from:
        description: 'Team name to replace (optional)'
        required: false
        type: string
      rename_to:
        description: 'Replacement team name (optional)'
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape team list
        run: |
          python .github/scripts/scrape_teams.py || echo "Scrape skipped (optional)"
      - name: Run parser
        env:
          INPUT_FILE_PATH: ${{ inputs.file_path }}
          RACE_NAME: ${{ inputs.race_name }}
          RENAME_FROM: ${{ inputs.rename_from }}
          RENAME_TO: ${{ inputs.rename_to }}
        run: python parser/process.py "$INPUT_FILE_PATH" output_new.csv "$RACE_NAME" "$RENAME_FROM=$RENAME_TO"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: upload-ready-csv
          path: output_new.csv
