name: Process TPV Results

on:
  push:
    paths:
      - 'SampleData/**'
      - 'parser/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape team list
        run: |
          python .github/scripts/scrape_teams.py || echo "Scrape skipped (optional)"
      - name: Run parser
        run: python parser/process.py SampleData/"Sample Data - Raw.csv" output.csv
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: upload-ready-csv
          path: output.csv
