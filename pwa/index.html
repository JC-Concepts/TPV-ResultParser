<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPV Result Parser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            velo: {
              dark: '#0b0f14',
              card: '#111827',
              accent: '#f97316',
              teal: '#14b8a6',
              gold: '#f59e0b',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .dark .glass { background: rgba(17,24,39,0.7); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100 to-emerald-50 text-slate-900 dark:bg-gradient-to-br dark:from-slate-900 dark:via-slate-950 dark:to-emerald-950 dark:text-slate-100 min-h-screen transition-colors duration-300">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-gradient-to-b from-slate-900/80 to-slate-950/90 border-r border-slate-200 dark:border-white/10 flex flex-col transition-all duration-300 shrink-0 backdrop-blur-xl">
      <div class="flex items-center gap-3 px-6 py-6 border-b border-slate-200 dark:border-white/10">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/30">
          <i class="fa-solid fa-bicycle text-slate-900 dark:text-white text-lg"></i>
        </div>
        <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white nav-label">TPV Parser</span>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-1">
        <button onclick="showTab('results')" id="nav-results" class="w-full flex items-center gap-4 px-3 py-3 text-white font-extrabold transition hover:scale-[1.02] hover:text-amber-300">
          <i class="fa-solid fa-chart-line w-6 text-center text-amber-400"></i>
          <span class="nav-label">Results</span>
        </button>
        <button onclick="showTab('upload')" id="nav-upload" class="w-full flex items-center gap-4 px-3 py-3 text-white font-bold transition hover:scale-[1.02] hover:text-amber-300">
          <i class="fa-solid fa-cloud-arrow-up w-6 text-center text-teal-400"></i>
          <span class="nav-label">Upload</span>
        </button>
      </nav>
      <div class="p-4 border-t border-slate-200 dark:border-white/10">
        <button onclick="toggleTheme()" class="w-full flex items-center gap-4 px-3 py-3 text-white font-bold transition hover:scale-[1.02] hover:text-amber-300">
          <i class="fa-solid fa-moon text-amber-400"></i>
          <span class="nav-label">Theme</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto">
      <header class="sticky top-0 z-10 glass border-b border-slate-200 dark:border-white/10 px-8 py-5 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-white/10 transition text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white" aria-label="Toggle sidebar">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
          <h1 id="page-title" class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Results</h1>
        </div>
        <div class="text-sm text-slate-600 dark:text-slate-300">Virtual Cycling Race Organizer</div>
      </header>

      <!-- Results Page -->
      <section id="tab-results" class="max-w-6xl mx-auto px-8 py-12">
        <div id="race-tabs" class="flex gap-2 mb-6 overflow-x-auto pb-2"></div>
        <div class="rounded-3xl bg-white dark:bg-gradient-to-br dark:from-slate-800/60 dark:to-slate-900/60 border border-slate-200 dark:border-slate-200 dark:border-white/10 shadow-2xl shadow-slate-200/40 dark:shadow-black/40 p-8 backdrop-blur-xl">
          <div class="flex items-center gap-3 mb-6">
            <div class="w-2 h-8 rounded-full bg-gradient-to-b from-amber-400 to-orange-500"></div>
            <h2 id="results-title" class="text-2xl font-extrabold text-slate-900 dark:text-white">Processed Results</h2>
          </div>
          <p class="text-slate-600 dark:text-slate-300 mb-6">Results loaded from CSV.</p>
          <div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-white/10">
            <table id="results-table" class="w-full text-sm text-left border-collapse">
              <thead class="text-xs uppercase bg-gradient-to-r from-slate-800 to-slate-900 text-amber-200">
                <tr id="results-header"></tr>
              </thead>
              <tbody id="results-body" class="divide-y divide-white/5"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Upload Page -->
      <section id="tab-upload" class="hidden max-w-3xl mx-auto px-8 py-12">
        <div class="rounded-3xl bg-white dark:bg-gradient-to-br dark:from-slate-800/60 dark:to-slate-900/60 border border-slate-200 dark:border-slate-200 dark:border-white/10 shadow-2xl shadow-slate-200/40 dark:shadow-black/40 p-10 backdrop-blur-xl">
          <div class="flex items-center gap-3 mb-2">
            <div class="w-2 h-8 rounded-full bg-gradient-to-b from-teal-400 to-emerald-500"></div>
            <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">Upload</h2>
          </div>
          <p class="text-slate-600 dark:text-slate-300 mb-6">Select a CSV or ZIP file to process.</p>

          <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-800 dark:text-slate-200 mb-1">Race Name</label>
            <input type="text" id="raceName" placeholder="e.g. R1 Long" class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition" />
          </div>

          <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-800 dark:text-slate-200 mb-1">Rename Team (optional)</label>
            <div class="flex gap-2">
              <input type="text" id="renameFrom" placeholder="From team name" class="w-1/2 px-4 py-3 rounded-xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition" />
              <input type="text" id="renameTo" placeholder="To team name" class="w-1/2 px-4 py-3 rounded-xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition" />
            </div>
          </div>

          <div class="flex flex-wrap gap-4 items-center mb-6">
            <label class="cursor-pointer inline-flex items-center gap-2 px-6 py-4 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-600 text-slate-900 dark:text-white font-bold shadow-xl shadow-teal-500/20 hover:shadow-teal-500/40 hover:scale-[1.03] transition">
              <i class="fa-solid fa-file-arrow-up"></i>
              <span>Select File</span>
              <input type="file" accept=".csv,.zip" class="hidden" onchange="updateFileName(this)" />
            </label>
            <span id="fileName" class="text-sm text-slate-600 dark:text-slate-300">No file selected</span>
          </div>

          <div class="flex gap-4">
            <button onclick="processFile()" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 text-slate-900 dark:text-white font-extrabold shadow-xl shadow-amber-500/20 hover:shadow-amber-500/40 hover:scale-[1.03] transition">Process</button>
            <button onclick="downloadResult()" class="px-8 py-4 rounded-2xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-bold hover:bg-slate-100 dark:hover:bg-white/10 transition">Download</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    async function loadResults() {
      try {
        const res = await fetch('output_new.csv');
        const text = await res.text();
        const rows = text.trim().split('\n').map(r => r.split(','));
        if (rows.length < 2) return;
        const header = rows[0];
        const body = rows.slice(1);
        document.getElementById('results-header').innerHTML = header.map(h => `<th class="px-5 py-4">${h}</th>`).join('');
        document.getElementById('results-body').innerHTML = body.map(r => `<tr class="hover:bg-slate-100 dark:hover:bg-slate-100 dark:bg-white/5 transition">${r.map(c => `<td class="px-5 py-4">${c}</td>`).join('')}</tr>`).join('');
      } catch (e) {
        console.log('No output_new.csv yet');
      }
    }

    function showTab(name) {
      document.getElementById('tab-results').classList.add('hidden');
      document.getElementById('tab-upload').classList.add('hidden');
      document.getElementById('tab-' + name).classList.remove('hidden');
      document.getElementById('page-title').textContent = name === 'results' ? 'Results' : 'Upload';
      document.getElementById('nav-results').classList.remove('hover:bg-slate-100 dark:hover:bg-white/5', 'text-slate-700 dark:text-slate-200', 'font-medium');
      document.getElementById('nav-results').classList.add('bg-gradient-to-r', 'from-amber-500/20', 'to-orange-500/20', 'text-amber-300', 'font-bold');
      document.getElementById('nav-upload').classList.remove('hover:bg-slate-100 dark:hover:bg-white/5', 'text-slate-700 dark:text-slate-200', 'font-medium');
      document.getElementById('nav-upload').classList.add('text-teal-300', 'font-bold');
      document.getElementById('nav-' + name).classList.remove('hover:bg-slate-100 dark:hover:bg-white/5', 'text-slate-700 dark:text-slate-200', 'font-medium');
      document.getElementById('nav-' + name).classList.add('bg-gradient-to-r', 'from-amber-500/20', 'to-orange-500/20', 'text-amber-300', 'font-bold');
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
    (function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const labels = document.querySelectorAll('.nav-label');
      const icons = document.querySelectorAll('#sidebar nav button i');
      if (sb.classList.contains('w-64')) {
        sb.classList.remove('w-64');
        sb.classList.add('w-16');
        labels.forEach(l => l.classList.add('hidden'));
        icons.forEach(i => { i.classList.remove('w-5'); i.classList.add('mx-auto', 'block'); });
      } else {
        sb.classList.remove('w-16');
        sb.classList.add('w-64');
        labels.forEach(l => l.classList.remove('hidden'));
        icons.forEach(i => { i.classList.remove('mx-auto', 'block'); i.classList.add('w-5'); });
      }
    }

    function updateFileName(input) {
      document.getElementById('fileName').textContent = input.files[0] ? input.files[0].name : 'No file selected';
    }

    function processFile() {
      const race = document.getElementById('raceName').value || 'Race';
      const fromTeam = document.getElementById('renameFrom').value;
      const toTeam = document.getElementById('renameTo').value;
      const url = `https://github.com/JC-Concepts/TPV-ResultParser/actions/workflows/process.yml`;
      alert('To trigger the GitHub Action, visit: ' + url + '\nRace: ' + race + (fromTeam && toTeam ? '\nRename: ' + fromTeam + ' -> ' + toTeam : ''));
    }

    function downloadResult() {
      alert('Download would serve output_new.csv or race-specific CSV.');
    }

    loadResults();
  </script>
</body>
</html>
